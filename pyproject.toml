[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "cica"
version = "0.1.0"
description = "Contrastive Independent Component Analysis (cICA) algorithms"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "cICA Contributors"}
]
keywords = ["ICA", "contrastive", "independent component analysis", "tensor decomposition"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "PyMoments>=0.1.0",
    "scikit-learn>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "jupyter>=1.0.0",
    "matplotlib>=3.0.0",
    "pandas>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/mvaliadis/cICA"
Repository = "https://github.com/mvaliadis/cICA"
